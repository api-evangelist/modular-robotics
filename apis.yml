name: Modular Robotics
description: >-
  Modular Robotics is a Boulder, Colorado hardware and educational-robotics
  company best known for Cubelets, magnetic modular robot construction blocks
  organized into SENSE, THINK, and ACT categories, and the MOSS building system.
  It also produces the Dexter Industries STEM product line, including the GoPiGo
  Raspberry Pi robot, BrickPi (LEGO Mindstorms plus Raspberry Pi), GrovePi, and
  the micro:bit GiggleBot. The company sells physical robotics kits and companion
  apps such as the browser-based Cubelets Console with Blockly and C coding
  rather than a public HTTP API; programmatic access is provided through
  first-party open-source Python driver libraries published on PyPI and
  maintained under the official DexterInd GitHub organization.
